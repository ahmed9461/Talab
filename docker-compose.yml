services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talab
      POSTGRES_USER: talab
      POSTGRES_PASSWORD: talab
    ports:
      - "5432:5432"
    volumes:
      - talab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talab -d talab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talab_postgres:
